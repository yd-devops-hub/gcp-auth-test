name: "GCP Auth Test Workflow"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  FOLDER_NAME: "test-folder-iac"
  PROJECT_NAME: "yd-devops-hub-test-project-iac"

defaults:
  run:
    shell: "bash"

jobs:
  build:
    # Allow the job to fetch a GitHub ID token
    permissions:
      id-token: write
      contents: read

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - id: "auth-on-pr"
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v3"
        with:
          create_credentials_file: true
          workload_identity_provider: "projects/850812025847/locations/global/workloadIdentityPools/yashrajdighe-iac-readonly/providers/read-access"
          service_account: "yashrajdighe-iac-readonly@project-c0cea0c3-cf00-4dc8-b6d.iam.gserviceaccount.com"

      - id: "auth-on-push"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v3"
        with:
          create_credentials_file: true
          workload_identity_provider: "projects/850812025847/locations/global/workloadIdentityPools/yashrajdighe-iac/providers/write-access"
          service_account: "yashrajdighe-iac@project-c0cea0c3-cf00-4dc8-b6d.iam.gserviceaccount.com"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v2"

      - name: "List all folders and projects in the org"
        run: |
          ORG_ID=$(gcloud organizations list --format='value(name)' | head -1)
          echo "=== Folders ==="
          gcloud resource-manager folders list --organization="$ORG_ID" --format="table(name, displayName, lifecycleState)"
          echo "=== Projects ==="
          gcloud projects list --format="table(projectId, name, parent.id, parent.type)"

      - name: "Create folder ${{ env.FOLDER_NAME }}"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: "create-folder"
        run: |
          ORG_ID=$(gcloud organizations list --format='value(name)' | head -1)
          FOLDER_ID=$(gcloud resource-manager folders list \
            --organization="$ORG_ID" \
            --filter="displayName=$FOLDER_NAME" \
            --format="value(name)" | head -1)

          if [[ -n "$FOLDER_ID" ]]; then
            echo "Folder '$FOLDER_NAME' already exists: $FOLDER_ID"
          else
            echo "Creating folder '$FOLDER_NAME'..."
            FOLDER_ID=$(gcloud resource-manager folders create \
              --display-name="$FOLDER_NAME" \
              --organization="$ORG_ID" \
              --format="value(name)")
            echo "Folder created: $FOLDER_ID"
          fi

          echo "folder_id=$FOLDER_ID" >> "$GITHUB_OUTPUT"

      - name: "Create project ${{ env.PROJECT_NAME }} in ${{ env.FOLDER_NAME }}"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          FOLDER_ID=${{ steps.create-folder.outputs.folder_id }}
          FOLDER_NUM=${FOLDER_ID#folders/}

          if gcloud projects describe "$PROJECT_NAME" &>/dev/null; then
            echo "Project '$PROJECT_NAME' already exists, skipping creation."
          else
            echo "Creating project '$PROJECT_NAME' in folder $FOLDER_NUM..."
            gcloud projects create "$PROJECT_NAME" \
              --folder="$FOLDER_NUM" \
              --name="$PROJECT_NAME"
            echo "Project created."
          fi
